<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · GSO Inventory</title>
<style>body{margin:0;background:#f3f6f9;color:#17324d;font:16px/1.5 system-ui,sans-serif}.card{max-width:430px;margin:10vh auto;padding:30px;background:white;border:1px solid #dbe4ed;border-radius:14px}h1{margin-top:0}label{display:block;font-weight:650;margin:14px 0 5px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #aebdca;border-radius:7px;font:inherit}button{margin-top:20px;padding:11px 16px;border:0;border-radius:7px;background:#123b66;color:white;font:inherit;font-weight:650;cursor:pointer}a{color:#123b66}.errorlist{color:#9e2f2f} :focus-visible{outline:3px solid #d59b2d;outline-offset:2px}</style></head>
<body><main class="card"><p>GRAND · GSO</p><h1>Sign in</h1><p>Use the employee account issued by your administrator.</p>
{% if form.errors %}<p role="alert">The username or password was not accepted. Check the details and try again.</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
<label for="id_username">Username</label><input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
<label for="id_password">Password</label><input id="id_password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form>
<p><a href="{% url 'password-reset' %}">Forgot your password?</a></p></main></body></html>
