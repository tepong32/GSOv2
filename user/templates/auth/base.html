<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Account{% endblock %} · GSO Inventory</title>
<style>body{margin:0;background:#f3f6f9;color:#17324d;font:16px/1.55 system-ui,sans-serif}.card{box-sizing:border-box;max-width:560px;margin:8vh auto;padding:30px;background:white;border:1px solid #dbe4ed;border-radius:14px}h1{margin-top:0}label{display:block;font-weight:650;margin:13px 0 5px}input{box-sizing:border-box;max-width:100%;padding:10px;border:1px solid #aebdca;border-radius:7px;font:inherit}button,.button{display:inline-block;margin-top:15px;padding:10px 15px;border:0;border-radius:7px;background:#123b66;color:white;font:inherit;font-weight:650;text-decoration:none}a{color:#123b66}.helptext{display:block;color:#596b7d}.errorlist{color:#9e2f2f}:focus-visible{outline:3px solid #d59b2d;outline-offset:2px}</style></head>
<body><main class="card"><p>GRAND · GSO</p>{% block form %}{% endblock %}</main></body></html>
