{% extends "auth/base.html" %}
{% block title %}Reset password{% endblock %}
{% block form %}<h1>Reset password</h1><p>Enter the email address on your employee account. If it matches an account, reset instructions will be sent.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Send reset instructions</button></form><p><a href="{% url 'login' %}">Back to sign in</a></p>{% endblock %}
