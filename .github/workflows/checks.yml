name: GSO checks
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
